---
# Applied by Kustomization ghcr-pull-secret (ks.yaml), with the cluster key:
# Secret ghcr-pull in namespace freepbx, the pull credential for the private
# package ghcr.io/ferry133/freepbx (ferry133/jg-extras#23).
# The token is a classic PAT with read:packages only; it lives in the operator's
# keychain (service ghcr-pull). It EXPIRES 2026-12-24 — renew before then.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ghcr-pull.sops.yaml
