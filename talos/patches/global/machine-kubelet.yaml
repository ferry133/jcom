machine:
  kubelet:
    extraConfig:
      serializeImagePulls: false
    # local-path-provisioner (jg-base base/storage) keeps its volumes under
    # /var/local-path-provisioner. kubelet runs in its own container on Talos and
    # resolves a volumeMount's `subPath` inside that container: without this bind
    # the path lands on kubelet's own rootfs, so the mount silently points at an
    # overlay that is lost on every kubelet restart. A plain (no subPath) mount
    # still works, which is why nothing failed loudly (ferry133/jg-base#150).
    extraMounts:
      - destination: /var/local-path-provisioner
        type: bind
        source: /var/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
    nodeIP:
      validSubnets:
        - 10.9.8.0/24
